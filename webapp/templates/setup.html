{% extends "base.html" %}
{% block title %}First-Run Setup{% endblock %}
{% block body %}
<div class="auth-wrap">
  <form class="auth-card" method="post">
    <h1>Welcome to ShopTrack Pro</h1>
    <p class="subtitle">No accounts exist yet. Create the store administrator.</p>
    {% include "_flashes.html" %}
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="username">Admin Username</label>
    <input id="username" name="username" value="{{ request.form.username }}" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <label for="confirm">Confirm Password</label>
    <input id="confirm" name="confirm" type="password" required>
    <div style="margin-top:20px"><button class="btn block success" type="submit">Create Admin Account</button></div>
    <div class="demo-box">Tip: use <b>admin</b> / <b>admin123</b> for evaluation.</div>
  </form>
</div>
{% endblock %}
